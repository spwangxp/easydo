apiVersion: v1
kind: Service
metadata:
  name: {{ include "easydo.aiRuntimeFullname" . }}
  labels:
    {{- include "easydo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.aiRuntime.service.type }}
  selector:
    {{- include "easydo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ai-runtime
  ports:
    - name: http
      port: {{ .Values.aiRuntime.service.port }}
      targetPort: http
      protocol: TCP
